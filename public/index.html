<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>S_19 TOURNAMENT — Play Win Enjoy</title>
<meta name="description" content="Daily Free Fire tournaments — BR, CS and Lone Wolf. Book your slot, play the custom room, and win real Taka prizes.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="splash" class="splash">
  <div class="splash-glow"></div>
  <img class="splash-logo" src="/logo.webp" alt="S_19 Tournament logo" onerror="this.src='/icon-512.png'">
  <div class="splash-title">S_19 TOURNAMENT</div>
  <div class="splash-sub">Loading app data...</div>
  <div class="splash-spin"><div class="splash-hex"></div><span class="splash-dot"></span></div>
  <div class="splash-ver">VERSION 1.0.0</div>
</div>
<div id="app"></div>
<div id="modal-root"></div>
<script src="/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; window.__s19Install = e; const b = document.getElementById('dl-btn'); if (b) b.style.display = ''; });
  // Once installed, the Download button never shows again on this phone.
  window.addEventListener('appinstalled', () => { window.__s19AppInstalled = true; const b = document.getElementById('dl-btn'); if (b) b.style.display = 'none'; });
</script>
</body>
</html>
